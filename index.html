<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101013">
  <meta name="description" content="KRAFTWERK 24 – dein persönlicher Trainings-, Ernährungs- und Fortschritts-Tracker.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <title>KRAFTWERK 24</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" data-page="dashboard" aria-label="KRAFTWERK 24 Startseite">
        <span class="brand-mark">K24</span>
        <span><strong>KRAFTWERK 24</strong><small>PERSONAL FITNESS SYSTEM</small></span>
      </a>
      <nav class="side-nav" aria-label="Hauptnavigation">
        <button class="nav-link active" data-page="dashboard"><span>⌂</span> Dashboard</button>
        <button class="nav-link" data-page="training"><span>▣</span> Gym-Training</button>
        <button class="nav-link" data-page="home"><span>⌂</span> Home Workout</button>
        <button class="nav-link" data-page="nutrition"><span>◉</span> Ernährung</button>
        <button class="nav-link" data-page="fight"><span>✦</span> Martial Arts</button>
        <button class="nav-link" data-page="progress"><span>↗</span> Fortschritt</button>
        <button class="nav-link" data-page="calendar"><span>▦</span> Kalender</button>
        <button class="nav-link" data-page="settings"><span>⚙</span> Einstellungen</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="local-status"><i></i><span><strong>Lokaler Modus</strong><small>Daten auf diesem Gerät</small></span></div>
        <small class="version">VERSION 1.0 · OFFLINE FIRST</small>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <div class="eyebrow" id="top-date">DEIN FITNESS-BEREICH</div>
          <h1 id="top-title">Dashboard</h1>
        </div>
        <div class="top-actions">
          <span class="sync-pill"><i></i> Lokal gespeichert</span>
          <button class="icon-button" data-page="settings" title="Einstellungen" aria-label="Einstellungen">⚙</button>
        </div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
      <footer class="app-footer">
        <span>KRAFTWERK 24</span>
        <span>Deine Daten bleiben lokal auf diesem Gerät, bis du sie exportierst.</span>
      </footer>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Mobile Navigation">
    <button class="mobile-link active" data-page="dashboard"><span>⌂</span><small>Home</small></button>
    <button class="mobile-link" data-page="training"><span>▣</span><small>Gym</small></button>
    <button class="mobile-link" data-page="nutrition"><span>◉</span><small>Ernährung</small></button>
    <button class="mobile-link" data-page="fight"><span>✦</span><small>Fight</small></button>
    <button class="mobile-link" data-page="progress"><span>↗</span><small>Stats</small></button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <script type="module" src="js/app.js"></script>
</body>
</html>
